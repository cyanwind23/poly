{{- define "poly.v3.podTemplate" }}
{{- $app := $.currentApp -}}
{{- $isJobOrCronJob := mustHas $app.deployType (list "Job" "CronJob") -}}
{{- if not (hasKey $app.podLifecycle "restartPolicy") -}}
  {{- $_ := set $app.podLifecycle "restartPolicy" (ternary "OnFailure" "Always" $isJobOrCronJob) -}}
{{- else if and $isJobOrCronJob (eq $app.podLifecycle.restartPolicy "Always") -}}
  {{- $_ := set $app.podLifecycle "restartPolicy" "OnFailure" -}}
{{- end -}}
metadata: {{- include "poly.v3.commonMetadata" $ | nindent 2 }}
{{- with $app.vault.injectorLabels }}
{{- toYaml . | nindent 4 }}
{{- end -}}
{{- with mustMerge (fromYaml (include "poly.v3.vault.annotations" $)) $app.podAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  containers: {{- toYaml (list (fromYaml (include "poly.v3.container" $))) | nindent 4 }}
  {{- with $app.extraContainers }}
  {{- toYaml . | nindent 4 -}}
  {{- end }}
  {{- with $app.initContainers }}
  initContainers: {{- toYaml . | nindent 4 -}}
  {{- end }}
  {{- with $app.ephemeralContainers }}
  ephemeralContainers: {{- toYaml . | nindent 4 -}}
  {{- end }}
  imagePullSecrets: {{ toYaml $app.imagePullSecrets | default list | nindent 4 }}
  {{- $volumes := (include "poly.v3.pod.volumes" $) | trimAll "\n" -}}
  {{- with $volumes }}
  volumes: {{- . | nindent 2 }}
  {{- end -}}
  {{- with $.currentApp.schedule }}
  {{- include "poly.v3.pod.schedule" $ | nindent 2 -}}
  {{- end -}}
  {{- with $app.podLifecycle -}}{{- toYaml . | nindent 2 }}{{- end }}
  {{- with $app.hostAliases }}
  hostAliases: {{- toYaml . | nindent 2 }}
  {{- end }}
  serviceAccountName: {{ include "poly.v3.serviceAccountName" $ }}
  automountServiceAccountToken: {{ $app.serviceAccount.automountServiceAccountToken }}
  {{- with $app.podExtraConfigs }}
  {{- toYaml . | nindent 2 }}
  {{- end -}}
{{- end -}}

{{- define "poly.v3.pod.schedule" -}}
{{- toYaml $.currentApp.schedule -}}
{{- end }}

{{- define "poly.v3.quickMount.volumeName" -}}
{{- .item.volumeName | default (printf "%s-%s" .prefix ((.item.name | default .item.fullName) | trimPrefix "-")) | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{- define "poly.v3.quickMount.resourceName" -}}
{{- if .item.fullName -}}
{{- .item.fullName -}}
{{- else if .item.create -}}
{{- printf "%s-%s" .releaseName .item.name -}}
{{- else -}}
{{- ternary (printf "%s%s" .releaseName .item.name) .item.name (hasPrefix "-" .item.name) -}}
{{- end -}}
{{- end -}}

{{- define "poly.v3.pod.volumes" -}}
{{- with (concat $.currentApp.volumes $.currentApp.extraVolumes) }}
{{- toYaml . }}
{{- end }}
{{- range $pvc := $.currentApp.pvcs }}
{{- if $pvc.mountPath }}
- name: {{ $pvc.name }}
  persistentVolumeClaim:
    claimName: {{ $pvc.name }}
{{- end }}
{{- end }}
{{- range $group := list (dict "items" $.currentApp.configMaps "prefix" "cm" "kind" "configMap" "nameKey" "name") (dict "items" $.currentApp.secrets "prefix" "secret" "kind" "secret" "nameKey" "secretName") }}
{{- range $item := $group.items }}
{{- if $item.mountPath }}
{{- $volName := include "poly.v3.quickMount.volumeName" (dict "item" $item "prefix" $group.prefix) }}
{{- $resName := include "poly.v3.quickMount.resourceName" (dict "item" $item "releaseName" $.Release.Name) }}
- name: {{ $volName }}
  {{ $group.kind }}:
    {{ $group.nameKey }}: {{ $resName }}
    {{- with $item.items }}
    items: {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $item.defaultMode }}
    defaultMode: {{ . }}
    {{- end }}
    {{- if hasKey $item "optional" }}
    optional: {{ $item.optional }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}

{{- define "poly.v3.container" }}
{{- $app := $.currentApp -}}
name: {{ $app.containerName | default (include "poly.v3.name" $) }}
image: {{ include "poly.v3.image" $ | quote }}
imagePullPolicy: {{ $app.image.pullPolicy }}
{{- include "poly.v3.container.cmd" $ }}
ports: {{- include "poly.v3.container.ports" $ | nindent 2 }}
{{- with $app.env }}
env: {{- include "poly.v3.container.env" $ | indent 2 }}
{{- end -}}
{{- with $app.envFrom }}
envFrom: {{- include "poly.v3.container.envFrom" $ | nindent 2 }}
{{- end -}}
{{ $volumeMounts := (include "poly.v3.container.volumeMounts" $) | trimAll "\n" }}
{{ if $volumeMounts }}
volumeMounts: {{- $volumeMounts | nindent 2 }}
{{- end }}
resources: {{- toYaml $app.resources | nindent 2 }}
{{- $isJobOrCronJob := mustHas $app.deployType (list "Job" "CronJob") -}}
{{- if or (not $isJobOrCronJob) $app.lifecycleOverride $app.lifecycle.enabled -}}
{{ include "poly.v3.container.lifecycle" $ }}
{{- end -}}
{{- if $app.probesOverride }}
{{ toYaml $app.probesOverride }}
{{- else -}}
{{- $probes := $app.probes | default dict -}}
{{- $probesEnabled := not $isJobOrCronJob -}}
{{- if hasKey $probes "enabled" -}}
  {{- $probesEnabled = $probes.enabled -}}
{{- end -}}
{{- if $probesEnabled -}}
{{- $probesCopy := deepCopy $probes -}}
{{- $_ := set $probesCopy "healthcheckPath" $app.quickConfigs.healthcheckPath }}
{{ include "poly.v3.container.probes" $probesCopy }}
{{- end -}}
{{- end -}}
{{- end -}}

{{/* Container cmd section */}}
{{- define "poly.v3.container.cmd" }}
{{- $app := $.currentApp -}}
{{- $vault := $.currentApp.vault -}}
{{- $cmd := ternary $vault.runContainer $app $vault.enabled -}}
{{- with $cmd.command }}
command: {{- toYaml . | nindent 2 }}
{{- end -}}
{{- with $cmd.runtimeArgs }}
args: {{- toYaml . | nindent 2 }}
{{- end -}}
{{- end -}}

{{/* Container ports section */}}
{{- define "poly.v3.container.ports" }}
{{- $app := $.currentApp -}}
{{- range $port := $app.ports | default (list $app.quickConfigs.port) }}
{{- if kindIs "map" $port -}}
- containerPort: {{ $port.containerPort }}
  name: {{ $port.name | default "http" }}
  protocol: {{ $port.protocol | default "TCP" }}
  {{- with $port.hostIP }}
  hostIP: {{ . }}
  {{- end -}}
  {{- with $port.hostPort }}
  hostPort: {{ . }}
  {{- end -}}
{{- else -}}
{{- $params := concat (without (mustRegexSplit ":" (. | toString) -1) "\"\"" "''") (list "" "") -}}
- containerPort: {{ first $params }}
  name: {{ index $params 1 | default "http" }}
  protocol: {{ index $params 2 | default "TCP" }}
{{ end }}
{{- end }}
{{- end -}}

{{/* Container envFrom env */}}
{{- define "poly.v3.container.env" }}
{{- range $key, $val := $.currentApp.env }}
- name: {{ $key | quote }}
{{ if not (hasPrefix "~" $val) }}
  value: {{ $val | quote }}
{{ else }}
{{ $params := (mustRegexSplit ":" ((trimPrefix "~" $val) | toString) -1) }}
  valueFrom:
  {{ if eq (first $params) "cfm" }}
    configMapKeyRef:
      key: {{ index $params 1 }}
      name: {{ index $params 2 }}
      optional: {{ eq (index $params 3) "true" }}
  {{ else if eq (first $params) "scr" }}
    secretKeyRef:
      key: {{ index $params 1 }}
      name: {{ index $params 2 }}
      optional: {{ eq (index $params 3) "true" }}
  {{ else if eq (first $params) "fr" }}
    fieldRef:
      fieldPath: {{ index $params 1 }}
      apiVersion: {{ index $params 2 }}
  {{ else }}
    resourceFieldRef:
      resource: {{ index $params 1 }}
      containerName: {{ index $params 2 }}
      divisor: {{ index $params 3 }}
  {{ end }}
{{- end }}
{{- end }}
{{- end }}

{{/* Container envFrom section */}}
{{- define "poly.v3.container.envFrom" }}
{{ $envFrom := dict }}
{{- $app := $.currentApp -}}
{{- range $val := $app.envFrom }}
{{ if kindIs "string" $val }}
{{ $params := concat (without (mustRegexSplit ":" $val -1) "\"\"" "''") (list "") }}
- {{ ternary "configMapRef" "secretRef" (eq (first $params) "cfm") }}:
{{- $name := index $params 1 }}
    name: {{ ternary (printf "%s%s" $.Release.Name $name) $name (hasPrefix "-" $name) }}
    optional: {{ index $params 2 }}
{{- with (index $params 3) }}
  prefix: {{ . }}
{{- end -}}
{{ else }}
{{ if hasKey $val "configMapRef" }}
{{ $name := $val.configMapRef.name }}
- configMapRef:
    name: {{ ternary (printf "%s%s" $.Release.Name $name) $name (hasPrefix "-" $name) }}
    optional: {{ $val.configMapRef.optional }}
{{- else -}}
{{ $name := $val.secretRef.name }}
- secretRef:
    name: {{ ternary (printf "%s%s" $.Release.Name $name) $name (hasPrefix "-" $name) }}
    optional: {{ $val.secretRef.optional }}
{{- end }}
{{- with $val.prefix }}
  prefix: {{ . }}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{/* Container lifecycle section */}}
{{- define "poly.v3.container.lifecycle" }}
{{ $app := $.currentApp }}
{{ if $app.lifecycleOverride }}
lifecycle: {{ toYaml $app.lifecycleOverride | nindent 2 }}
{{ else if or $app.lifecycle.postStart $app.lifecycle.preStop }}
lifecycle:
{{ with $app.lifecycle.postStart }}
  postStart: {{ include "poly.v3.lifecycleHandler" . | nindent 4 }}
{{ end }}
{{ with $app.lifecycle.preStop }}
  preStop: {{ include "poly.v3.lifecycleHandler" . | nindent 4 }}
{{ end }}
{{ end }}
{{ end }}

{{- define "poly.v3.lifecycleHandler" }}
{{ with .execCommand }}
exec:
  command: {{ toYaml . | nindent 4 }}
{{ end }}
{{ with .httpGet }}
{{ $params := concat (without (mustRegexSplit ":" .request -1) "\"\"" "''") (list "" "") }}
httpGet:
  path: {{ $.healthcheckPath | default (first $params) }}
  port: {{ index $params 1 }}
  {{ with index $params 2 }}
  host: {{ . }}
  {{ end }}
  scheme: {{ index $params 3 | default "HTTP" }}
  {{ with .httpHeaders }}
  httpHeaders: {{ toYaml . | nindent 4 }}
  {{ end }}
{{ end }}
{{ with .tcpSocket }}
{{ $params := mustRegexSplit ":" . -1 }}
tcpSocket:
  host: {{ first $params }}
  port: {{ index $params 1 }}
{{ end }}
{{ end }}

{{/* Container probes section */}}
{{- define "poly.v3.container.probes" }}
{{- range $k := list "livenessProbe" "readinessProbe" "startupProbe" }}
{{- $p := get $ $k }}
{{- if $p }}
{{- if not (and (hasKey $p "enabled") (not $p.enabled)) }}
{{- $hasHandler := or $p.httpGet $p.execCommand $p.tcpSocket $p.grpc }}
{{- if and (not $hasHandler) $p.enabled $.healthcheckPath }}
{{- $pCopy := deepCopy $p }}
{{- $_ := set $pCopy "httpGet" (dict "request" (printf "%s:http" $.healthcheckPath)) }}
{{- $_ := set $pCopy "healthcheckPath" $.healthcheckPath }}
{{ $k }}: {{- include "poly.v3.probe" $pCopy | nindent 2 }}
{{- else if $hasHandler }}
{{- $pCopy := deepCopy $p }}
{{- $_ := set $pCopy "healthcheckPath" $.healthcheckPath }}
{{ $k }}: {{- include "poly.v3.probe" $pCopy | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}

{{- define "poly.v3.probe" }}
{{ include "poly.v3.lifecycleHandler" . }}
{{ $params := (without (mustRegexSplit ":" .params -1) "\"\"" "''") }}
initialDelaySeconds: {{ first $params | default 15 }}
periodSeconds: {{ index $params 1 | default 15 }}
timeoutSeconds: {{ index $params 2 | default 10 }}
failureThreshold: {{ index $params 3 | default 30 }}
successThreshold: {{ index $params 4 | default 1 }}
{{- with .grpc }}
grpc: {{- toYaml . | nindent 2 }}
{{- end -}}
{{ end }}

{{/* Container volumeMounts section */}}
{{- define "poly.v3.container.volumeMounts" }}
{{- $app := $.currentApp -}}
{{- range $val := (concat $app.volumeMounts $app.extraVolumeMounts) -}}
{{- if kindIs "string" $val -}}
{{- $params := concat (without (mustRegexSplit ":" $val -1) "\"\"" "''") (list "" "" "") }}
- mountPath: {{ index $params 1 }}
  name: {{ first $params }}
  readOnly: {{ eq (index $params 2) "true" | default false }}
  {{- with index $params 3 }}
  subPath: {{ . }}
  {{- end -}}
  {{- with (index $params 4) }}
  mountPropagation: {{ . }}
  {{- end }}
{{- else }}
- mountPath: {{ .mountPath }}
  name: {{ .name }}
  readOnly: {{ .readOnly | default false }}
  {{- with .subPath }}
  subPath: {{ . }}
  {{- end -}}
  {{- with .mountPropagation }}
  mountPropagation: {{ . }}
  {{ end }}
{{- end }}
{{- end }}
{{- range $pvc := $.currentApp.pvcs }}
{{- if $pvc.mountPath }}
- mountPath: {{ $pvc.mountPath }}
  name: {{ $pvc.name }}
{{- end }}
{{- end }}
{{- range $group := list (dict "items" $app.configMaps "prefix" "cm") (dict "items" $app.secrets "prefix" "secret") }}
{{- range $item := $group.items }}
{{- if $item.mountPath }}
{{- $volName := include "poly.v3.quickMount.volumeName" (dict "item" $item "prefix" $group.prefix) }}
- mountPath: {{ $item.mountPath }}
  name: {{ $volName }}
  readOnly: {{ if hasKey $item "readOnly" }}{{ $item.readOnly }}{{ else }}true{{ end }}
  {{- with $item.subPath }}
  subPath: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
{{- end -}}
{{- end }}



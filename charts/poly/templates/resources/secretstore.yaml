{{- define "poly.v3.secretStore" -}}
{{- $app := $.currentApp -}}
{{- $defaults := $app.externalSecret | default dict -}}
{{- range $store := $app.secretStores -}}
{{- if not (and (hasKey $store "enabled") (not $store.enabled)) -}}
{{- $storeName := include "poly.v3.fullname" $ -}}
{{- if $store.fullName -}}
  {{- $storeName = $store.fullName -}}
{{- else if $store.name -}}
  {{- $storeName = include "poly.v3.prefixName" (dict "Release" $.Release "prefixName" $store.name) -}}
{{- end }}
---
apiVersion: {{ $store.apiVersion | default $defaults.apiVersion | default "external-secrets.io/v1" }}
kind: {{ $store.kind | default "SecretStore" }}
metadata:
  name: {{ $storeName }}
  labels: {{- include "poly.v3.labels" $ | nindent 4 }}
  {{- with $store.annotations }}
  annotations: {{- include "poly.v3.tpl-dict" (dict "ctx" $ "dict" .) | trim | nindent 4 }}
  {{- end }}
spec:
  {{- with $store.controller }}
  controller: {{ . | quote }}
  {{- end }}
  {{- with $store.retrySettings }}
  retrySettings: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey $store "refreshInterval" }}
  refreshInterval: {{ $store.refreshInterval }}
  {{- end }}
  {{- with $store.conditions }}
  conditions: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $store.provider }}
  provider: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
{{- end -}}
{{- end -}}

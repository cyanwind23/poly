{{- define "poly.v3.secret" -}}
{{- $app := $.currentApp -}}
{{- range $secret := $app.secrets }}
{{- if $secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.fullName | default (printf "%s-%s" $.Release.Name $secret.name) }}
  labels: {{- include "poly.v3.labels" $ | nindent 4 }}
  {{- with $secret.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ $secret.type | default "Opaque" }}
{{- with $secret.data }}
data: {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $secret.stringData }}
stringData: {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}

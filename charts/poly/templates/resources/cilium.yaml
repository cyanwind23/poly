{{- define "poly.v3.cilium.metadata" -}}
{{- $ctx := get . "ctx" -}}
{{- $res := get . "res" -}}
{{- $name := include "poly.v3.fullname" $ctx -}}
{{- if $res.name -}}
{{- $name = include "poly.v3.prefixName" (dict "Release" $ctx.Release "prefixName" $res.name) -}}
{{- end }}
  name: {{ $name }}
  labels: {{- include "poly.v3.labels" $ctx | nindent 4 }}
  {{- with $res.annotations }}
  annotations: {{- include "poly.v3.tpl-dict" (dict "ctx" $ctx "dict" .) | trim | nindent 4 }}
  {{- end }}
{{- end -}}

{{- define "poly.v3.cilium" -}}
{{- $app := $.currentApp -}}
{{- if $app.enabled -}}
{{- $cilium := $app.cilium | default dict -}}
{{- $np := $cilium.networkPolicy | default dict -}}
{{- if $np.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
{{- include "poly.v3.cilium.metadata" (dict "ctx" $ "res" $np) }}
{{- if $np.specs }}
specs: {{- toYaml $np.specs | nindent 2 }}
{{- else }}
spec:
  {{- with $np.description }}
  description: {{ . | quote }}
  {{- end }}
  endpointSelector:
    {{- if $np.endpointSelector }}
    {{- toYaml $np.endpointSelector | nindent 4 }}
    {{- else }}
    matchLabels: {{- include "poly.v3.selectorLabels" $ | nindent 6 }}
    {{- end }}
  {{- with $np.ingress }}
  ingress: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $np.ingressDeny }}
  ingressDeny: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $np.egress }}
  egress: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $np.egressDeny }}
  egressDeny: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end -}}

{{- $cec := $cilium.envoyConfig | default dict -}}
{{- if $cec.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
{{- include "poly.v3.cilium.metadata" (dict "ctx" $ "res" $cec) }}
spec:
  {{- with $cec.services }}
  services: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cec.backendServices }}
  backendServices: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cec.resources }}
  resources: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
{{- end -}}
{{- end -}}

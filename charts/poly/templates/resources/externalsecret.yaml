{{- define "poly.v3.externalSecret" -}}
{{- $app := $.currentApp -}}
{{- $defaults := $app.externalSecret | default dict -}}
{{- range $secret := $app.secrets -}}
{{- $es := $secret.externalSecret | default dict -}}
{{- if and $es.enabled (not $secret.exists) -}}
{{- $targetName := "" -}}
{{- if and $es.target $es.target.name -}}
  {{- $targetName = $es.target.name -}}
{{- else if $secret.fullName -}}
  {{- $targetName = $secret.fullName -}}
{{- else -}}
  {{- $targetName = printf "%s-%s" $.Release.Name $secret.name -}}
{{- end -}}
{{- $esName := "" -}}
{{- if $es.name -}}
  {{- $esName = include "poly.v3.prefixName" (dict "Release" $.Release "prefixName" $es.name) -}}
{{- else -}}
  {{- $esName = $secret.fullName | default (printf "%s-%s" $.Release.Name $secret.name) -}}
{{- end }}
---
apiVersion: {{ $es.apiVersion | default $defaults.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ $esName }}
  labels: {{- include "poly.v3.labels" $ | nindent 4 }}
  {{- with $es.annotations }}
  annotations: {{- include "poly.v3.tpl-dict" (dict "ctx" $ "dict" .) | trim | nindent 4 }}
  {{- end }}
spec:
  {{- with ($es.refreshPolicy | default $defaults.refreshPolicy) }}
  refreshPolicy: {{ . }}
  {{- end }}
  {{- $refreshInterval := $defaults.refreshInterval | default "1h" -}}
  {{- if hasKey $es "refreshInterval" -}}
    {{- $refreshInterval = $es.refreshInterval -}}
  {{- end -}}
  {{- with $refreshInterval }}
  refreshInterval: {{ . }}
  {{- end }}
  {{- with ($es.secretStoreRef | default $defaults.secretStoreRef) }}
  secretStoreRef: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $target := merge (deepCopy ($es.target | default dict)) (dict "name" $targetName) }}
  target: {{- toYaml $target | nindent 4 }}
  {{- with $es.data }}
  data: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
{{- end -}}
{{- end -}}

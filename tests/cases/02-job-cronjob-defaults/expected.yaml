apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: test-release-my-agent-daemon-set
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: my-agent-daemon-set
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: my-agent-daemon-set
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      name: test-release-my-agent-daemon-set
      labels:
        helm.sh/chart: poly-3.1.0
        app.kubernetes.io/name: my-agent-daemon-set
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - image: myregistry.com/agent-service:v3.0.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - sleep
                - "3"
          name: my-agent-daemon-set
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          resources: {}
      imagePullSecrets: 
        []
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: Always
      serviceAccountName: default
      automountServiceAccountToken: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 0

apiVersion: batch/v1
kind: Job
metadata:
  name: test-release-my-migration-job
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: my-migration-job
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  template:
    metadata:
      name: test-release-my-migration-job
      labels:
        helm.sh/chart: poly-3.1.0
        app.kubernetes.io/name: my-migration-job
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - command:
          - /bin/sh
          - -c
          - migrate.sh
          image: myregistry.com/db-migrator:v1.0.0
          imagePullPolicy: IfNotPresent
          name: my-migration-job
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          resources: {}
      imagePullSecrets: 
        []
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: OnFailure
      serviceAccountName: default
      automountServiceAccountToken: true
  backoffLimit: 6
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  suspend: false




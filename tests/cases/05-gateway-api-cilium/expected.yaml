# Source: poly/templates/main.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-release-custom-http
  labels:
    helm.sh/chart: poly-3.0.5
    app.kubernetes.io/name: app-http-custom
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  parentRefs:
    - name: main-gateway
      namespace: infra
      sectionName: https
  hostnames:
    - api.example.com
  rules:
    - backendRefs:
      - name: test-release-app-http-custom
        port: 80
      filters:
      - requestHeaderModifier:
          set:
          - name: X-Env
            value: prod
        type: RequestHeaderModifier
      matches:
      - path:
          type: PathPrefix
          value: /api/v1
    - backendRefs:
      - name: custom-health-svc
        port: 9090
      matches:
      - path:
          type: Exact
          value: /health

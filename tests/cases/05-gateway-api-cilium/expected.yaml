# Source: poly/templates/main.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: test-release-app-cilium
  labels:
    helm.sh/chart: poly-3.0.5
    app.kubernetes.io/name: app-cilium
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    policy.cilium.io/owner: "platform"
spec:
  description: "Allow ingress from web and egress to DNS"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: app-cilium
      app.kubernetes.io/instance: test-release
  ingress:
    - fromEndpoints:
      - matchLabels:
          app: web
      toPorts:
      - ports:
        - port: "8080"
          protocol: TCP
  egress:
    - toEndpoints:
      - matchLabels:
          k8s-app: kube-dns
          k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
      - ports:
        - port: "53"
          protocol: UDP

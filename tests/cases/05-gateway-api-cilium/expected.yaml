# Source: poly/templates/main.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-app-cilium
  labels:
    helm.sh/chart: poly-3.0.5
    app.kubernetes.io/name: app-cilium
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: app-cilium
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      name: test-release-app-cilium
      labels:
        helm.sh/chart: poly-3.0.5
        app.kubernetes.io/name: app-cilium
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - image: myregistry.com/demo:v1.0.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - sleep
                - "3"
          name: app-cilium
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          resources: {}
      imagePullSecrets: 
        []
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: Always
      serviceAccountName: default
      automountServiceAccountToken: true
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 0

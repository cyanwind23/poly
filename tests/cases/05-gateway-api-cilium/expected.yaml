apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: test-release-app-grpc
  labels:
    helm.sh/chart: poly-3.0.5
    app.kubernetes.io/name: app-grpc
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - name: grpc-gateway
      namespace: infra
  hostnames:
    - grpc.example.com
  rules:
    - backendRefs:
      - name: test-release-app-grpc
        port: 50051
      matches:
      - method:
          method: SayHello
          service: helloworld.Greeter

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app.example.com
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: app-env-networking
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:    
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - app.example.com
      secretName: app-tls
  rules:
  - host: app.example.com
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: test-release-app-env-networking
              port:
                number: 80
        - path: /metrics
          pathType: Exact
          backend:
            service:
              name: test-release-app-env-networking
              port:
                number: 9090

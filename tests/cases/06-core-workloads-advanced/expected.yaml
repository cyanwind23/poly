apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-app-env-networking
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: app-env-networking
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: app-env-networking
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      name: test-release-app-env-networking
      labels:
        helm.sh/chart: poly-3.1.0
        app.kubernetes.io/name: app-env-networking
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - env:
          - name: CFG_ENV
            valueFrom:
              configMapKeyRef:
                key: app-key
                name: app-config
                optional: true
          - name: CPU_LIMIT
            valueFrom:
              resourceFieldRef:
                containerName: app-env-networking
                divisor: 1m
                resource: limits.cpu
          - name: PLAIN_ENV
            value: production
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: SCR_ENV
            valueFrom:
              secretKeyRef:
                key: db-pass
                name: app-secret
                optional: false
          envFrom:
          - configMapRef:
              name: test-release-app-cfg
              optional: true
          - secretRef:
              name: ext-secret
              optional: false
          image: myregistry.com/demo:v1.0.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - sleep
                - "3"
          name: app-env-networking
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          - containerPort: 9090
            name: metrics
            protocol: TCP
          resources: {}
      imagePullSecrets: 
        []
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: Always
      serviceAccountName: default
      automountServiceAccountToken: true
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 0

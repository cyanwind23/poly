# Source: poly/templates/main.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-app-vault-sa
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: app-vault-sa
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: app-vault-sa
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      name: test-release-app-vault-sa
      labels:
        helm.sh/chart: poly-3.1.0
        app.kubernetes.io/name: app-vault-sa
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-config.env: secret/data/demo
        vault.hashicorp.com/agent-inject-template-config.env: |-
          {{- with secret "secret/data/demo" -}}
          DB_PASS="{{ .Data.data.password }}"
          {{- end -}}
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/auth-path: auth/kubernetes
        vault.hashicorp.com/role: demo-role
        vault.hashicorp.com/service: https://vault.example.com
    spec:
      containers:
        - args:
          - . /vault/secrets/config.env && exec /app/server
          command:
          - /bin/sh
          - -c
          image: myregistry.com/demo:v1.0.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - sleep
                - "3"
          name: app-vault-sa
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          resources: {}
      imagePullSecrets: 
        []
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: Always
      serviceAccountName: test-release-app-vault-sa
      automountServiceAccountToken: true
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 0

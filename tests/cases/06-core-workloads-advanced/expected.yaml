# Source: poly/templates/main.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: test-release-app-rollout-bg
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: app-rollout-bg
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app-rollout-bg
      app.kubernetes.io/instance: test-release
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-release-app-rollout-bg
  strategy:
    blueGreen:
      activeService: test-release-app-rollout-bg
      previewService: rollout-svc-preview
      abortScaleDownDelaySeconds: 30
      autoPromotionEnabled: false
      autoPromotionSeconds: 30
      previewReplicaCount: 1
      scaleDownDelayRevisionLimit: 2
      scaleDownDelaySeconds: 30
  analysis:
    successfulRunHistoryLimit: 5
    unsuccessfulRunHistoryLimit: 5
  minReadySeconds: 30
  pause: true
  progressDeadlineAbort: false
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3

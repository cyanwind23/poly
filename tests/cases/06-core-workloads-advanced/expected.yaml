# Source: poly/templates/main.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-release-app-env-networking
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: app-env-networking
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  minReplicas: 2
  maxReplicas: 6
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-release-app-env-networking
  behavior:
    scaleDown:
      selectPolicy: Max
      stabilizationWindowSeconds: 300
    scaleUp:
      selectPolicy: Max
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

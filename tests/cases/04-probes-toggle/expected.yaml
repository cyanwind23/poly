apiVersion: batch/v1
kind: Job
metadata:
  name: test-release-app5-job-probes-enabled
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: app5-job-probes-enabled
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  template:
    metadata:
      name: test-release-app5-job-probes-enabled
      labels:
        helm.sh/chart: poly-3.1.0
        app.kubernetes.io/name: app5-job-probes-enabled
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - command:
          - /bin/sh
          - -c
          - run-job.sh
          image: myregistry.com/demo:v1.0.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /live
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          name: app5-job-probes-enabled
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          resources: {}
      imagePullSecrets: 
        []
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: OnFailure
      serviceAccountName: default
      automountServiceAccountToken: true
  backoffLimit: 6
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  suspend: false

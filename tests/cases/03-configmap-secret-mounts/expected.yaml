apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-app-combined-mounts
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: app-combined-mounts
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: app-combined-mounts
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      name: test-release-app-combined-mounts
      labels:
        helm.sh/chart: poly-3.1.0
        app.kubernetes.io/name: app-combined-mounts
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - image: myregistry.com/demo:v1.0.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - sleep
                - "3"
          name: app-combined-mounts
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          resources: {}
          volumeMounts:
          - mountPath: /tmp/scratch
            name: scratch-vol
            readOnly: false
          - mountPath: /var/lib/data
            name: data-pvc
          - mountPath: /etc/combined/cm
            name: cm-combined-cm
            readOnly: true
          - mountPath: /etc/combined/existing-cm
            name: cm-shared-existing-cm
            readOnly: true
          - mountPath: /etc/combined/secret
            name: secret-combined-es-secret
            readOnly: false
          - mountPath: /etc/combined/ca
            name: secret-existing-ca-secret
            readOnly: true
      imagePullSecrets: 
        []
      volumes:
      - emptyDir: {}
        name: scratch-vol
      - name: data-pvc
        persistentVolumeClaim:
          claimName: data-pvc
      - name: cm-combined-cm
        configMap:
          name: test-release-combined-cm
      - name: cm-shared-existing-cm
        configMap:
          name: shared-existing-cm
      - name: secret-combined-es-secret
        secret:
          secretName: test-release-combined-es-secret
      - name: secret-existing-ca-secret
        secret:
          secretName: existing-ca-secret
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: Always
      serviceAccountName: default
      automountServiceAccountToken: true
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 0

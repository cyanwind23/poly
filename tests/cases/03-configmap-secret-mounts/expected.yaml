apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: test-release-vault-store
  labels:
    helm.sh/chart: poly-3.1.0
    app.kubernetes.io/name: shared-secret-stores
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "1.0.0"

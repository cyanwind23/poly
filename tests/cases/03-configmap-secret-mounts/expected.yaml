        configMap:
          name: test-release-app-config
      affinity: {}
      nodeSelector: {}
      tolerations: []
      restartPolicy: Always
      serviceAccountName: default
      automountServiceAccountToken: true
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 0

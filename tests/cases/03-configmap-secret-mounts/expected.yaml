        app.kubernetes.io/instance: test-release
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - image: myregistry.com/demo:v1.0.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - sleep
                - "3"
          name: app-cm-created-file
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          resources: {}
          volumeMounts:
          - mountPath: /etc/app/config
            name: cm-app-config
            readOnly: true
      imagePullSecrets: 
        []
